name: Daily Creators API Price Sync

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-price-sync
  cancel-in-progress: false

jobs:
  daily-rebuild-ping:
    name: Trigger daily Netlify price-freshness rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Write daily rebuild ping
        run: |
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .daily-rebuild-ping
          printf '%s\n' '# Triggers the daily Netlify build so price freshness is regenerated with Netlify-managed credentials.' >> .daily-rebuild-ping
      - name: Commit and push rebuild ping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .daily-rebuild-ping
          if git diff --cached --quiet; then
            echo "No rebuild-ping change — nothing to commit."
          else
            git commit -m "chore: daily price-freshness rebuild ping"
            git push
          fi
