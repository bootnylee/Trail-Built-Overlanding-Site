name: Verify Deploy Live

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  verify:
    name: Poll version.txt until live
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy and verify version.txt
        env:
          SITE_URL: https://trailbuiltoverland.com
          EXPECTED_SHA: ${{ github.sha }}
          MAX_WAIT: 1200   # 20 minutes
          INTERVAL: 60
        run: |
          echo "Polling ${SITE_URL}/version.txt for SHA ${EXPECTED_SHA}"
          elapsed=0
          while [ $elapsed -lt $MAX_WAIT ]; do
            live_sha=$(curl -sf --max-time 10 "${SITE_URL}/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            echo "  [${elapsed}s] live=${live_sha:-<empty>}"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "✅ Deploy confirmed live at ${elapsed}s"
              exit 0
            fi
            sleep $INTERVAL
            elapsed=$((elapsed + INTERVAL))
          done
          echo "❌ Deploy NOT live after ${MAX_WAIT}s (last seen: ${live_sha:-<empty>})"
          exit 1

      - name: Open issue on timeout
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DEPLOY NOT LIVE: ${context.sha.slice(0,10)}`,
              body: [
                `## Netlify deploy did not go live within 20 minutes`,
                ``,
                `- **Commit:** ${context.sha}`,
                `- **Branch:** ${context.ref}`,
                `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Check the Netlify dashboard for build errors: https://app.netlify.com`,
              ].join('\n'),
              labels: ['deploy-failure'],
            });
