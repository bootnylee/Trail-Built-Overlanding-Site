name: Weekly Affiliate Destination Health Check

on:
  schedule:
    # Every Monday at 08:00 UTC (before the content workflow at 09:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  affiliate-destination-health:
    name: Validate live affiliate destinations and product-title consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: pip install requests

      - name: Validate named product destinations
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          python3 tools/validate_asins.py --output /tmp/affiliate_destination_report.json

      - name: Validate page-context ASIN mappings
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: python3 tools/validate_asin_mappings.py --output /tmp/asin_mapping_report.json

      - name: Open issue for affiliate destination defects
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const safe = (value) => String(value ?? '')
              .replace(/\|/g, '\\|')
              .replace(/[\r\n]+/g, ' ')
              .trim();

            let destinationReport = {};
            let mappingReport = {};
            try {
              destinationReport = JSON.parse(fs.readFileSync('/tmp/affiliate_destination_report.json', 'utf8'));
            } catch (error) {
              core.setFailed(`Named-destination report was not produced: ${error.message}`);
              return;
            }
            try {
              mappingReport = JSON.parse(fs.readFileSync('/tmp/asin_mapping_report.json', 'utf8'));
            } catch (error) {
              core.setFailed(`Context-mapping report was not produced: ${error.message}`);
              return;
            }

            const destinationFailures = (destinationReport.products || [])
              .filter(product => product.status === 'FAIL');
            const mappingFailures = (mappingReport.findings || [])
              .filter(finding => finding.verdict === 'MISMATCH' || finding.verdict === 'DEAD');

            if (destinationFailures.length === 0 && mappingFailures.length === 0) {
              console.log('All affiliate destinations passed named-product and page-context checks.');
              return;
            }

            const destinationLines = destinationFailures.map(product => {
              const destination = product.asin ? `\`${safe(product.asin)}\`` : safe(product.url);
              return `| ${safe(product.file)} | ${safe(product.product)} | ${destination} | ${safe(product.issue || 'destination validation failed')} |`;
            });
            const mappingLines = mappingFailures.map(finding =>
              `| ${safe(finding.page)} | \`${safe(finding.asin)}\` | ${safe(finding.context_name || finding.product_card_title || 'unknown')} | ${safe(finding.amazon_title || 'not returned')} | ${finding.score == null ? '—' : `${Math.round(finding.score * 100)}%`} | ${safe(finding.verdict)} |`
            );

            const total = destinationFailures.length + mappingFailures.length;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AFFILIATE DESTINATION HEALTH: ${total} issue(s) detected — ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## Weekly Affiliate Destination Health Check',
                '',
                `The checker reviewed **${destinationReport.total || 0}** named product destinations across the homepage, all articles, and all category pages.`,
                '',
                '### Named Product Destination Failures',
                destinationLines.length
                  ? ['| Source | Visible Product | Destination | Issue |', '|---|---|---|---|', ...destinationLines].join('\n')
                  : 'None.',
                '',
                '### Page-Context ASIN Mapping Failures',
                mappingLines.length
                  ? ['| Source | ASIN | Page Context | Amazon Title | Score | Verdict |', '|---|---|---|---|---|---|', ...mappingLines].join('\n')
                  : 'None.',
                '',
                `**Summary:** ${destinationReport.dead_asins || 0} dead ASIN(s), ${destinationReport.title_mismatches || 0} named-product title mismatch(es), ${destinationReport.search_destination_issues || 0} prohibited Amazon search destination(s), and ${mappingFailures.length} context-aware mapping finding(s).`,
                '',
                '**Action required:** Review each reported destination before the next content publish. INCONCLUSIVE Amazon lookups are intentionally excluded from issue creation.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['asin-health'],
            });
            console.log(`Opened issue for ${destinationFailures.length} named-destination and ${mappingFailures.length} context-mapping defect(s).`);
