name: Weekly ASIN Health Check

on:
  schedule:
    # Every Monday at 08:00 UTC (before the content workflow at 09:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  asin-health:
    name: Validate all ASINs and report dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run ASIN validation (warn-only — never blocks)
        id: validate
        env:
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          python3 tools/validate_asins.py --warn-only --output /tmp/asin_report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for dead ASINs and open issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/asin_report.json', 'utf8'));
            } catch (e) {
              console.log('No report file found, skipping issue creation');
              return;
            }

            const broken = (report.products || []).filter(p =>
              p.status === 'BROKEN' || p.status === 'NOT_FOUND' || p.http_status === 404
            );

            if (broken.length === 0) {
              console.log('✅ All ASINs healthy — no issue needed');
              return;
            }

            const lines = broken.map(p =>
              `| \`${p.asin}\` | ${p.name || p.product || 'unknown'} | ${p.status || p.error || 'dead'} |`
            );

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ASIN HEALTH: ${broken.length} dead ASIN(s) detected — ${new Date().toISOString().slice(0,10)}`,
              body: [
                `## Weekly ASIN Health Check — Dead ASINs Found`,
                ``,
                `| ASIN | Product | Status |`,
                `|------|---------|--------|`,
                ...lines,
                ``,
                `**Action required:** Replace dead ASINs with live equivalents before next weekly publish.`,
                ``,
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['asin-health'],
            });
            console.log(`⚠️ Opened issue for ${broken.length} dead ASIN(s)`);
