name: Weekly ASIN Health Check

on:
  schedule:
    # Every Monday at 08:00 UTC (before the content workflow at 09:00)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  asin-health:
    name: Validate ASIN liveness and product mappings (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run ASIN liveness validation (warn-only — never blocks)
        id: validate
        env:
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: |
          python3 tools/validate_asins.py --warn-only --output /tmp/asin_report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run ASIN mapping validation (warn-only — never blocks)
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: python3 tools/validate_asin_mappings.py --output /tmp/asin_mapping_report.json
        continue-on-error: true

      - name: Report dead or mis-mapped ASINs in a weekly issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const safe = (value) => String(value ?? '')
              .replace(/\|/g, '\\|')
              .replace(/[\r\n]+/g, ' ')
              .trim();

            let livenessReport = {};
            let mappingReport = {};
            try {
              livenessReport = JSON.parse(fs.readFileSync('/tmp/asin_report.json', 'utf8'));
            } catch (e) {
              console.log('No liveness report found; continuing with mapping report if available.');
            }
            try {
              mappingReport = JSON.parse(fs.readFileSync('/tmp/asin_mapping_report.json', 'utf8'));
            } catch (e) {
              console.log('No mapping report found; continuing with liveness report if available.');
            }

            const broken = (livenessReport.products || []).filter(p =>
              p.status === 'BROKEN' || p.status === 'NOT_FOUND' || p.http_status === 404
            );
            const mappingFindings = (mappingReport.findings || []).filter(f =>
              f.verdict === 'MISMATCH' || f.verdict === 'DEAD'
            );

            if (broken.length === 0 && mappingFindings.length === 0) {
              console.log('All conclusive ASIN liveness and mapping checks passed — no issue needed.');
              return;
            }

            const deadLines = broken.map(p =>
              `| \`${safe(p.asin)}\` | ${safe(p.name || p.product || 'unknown')} | ${safe(p.status || p.error || 'dead')} |`
            );
            const mappingLines = mappingFindings.map(f =>
              `| ${safe(f.page || 'catalog')} | \`${safe(f.asin)}\` | ${safe(f.context_name || f.product || 'unknown')} | ${safe(f.amazon_title || 'not returned')} | ${f.score == null ? '—' : `${Math.round(f.score * 100)}%`} | ${safe(f.verdict)} |`
            );
            const total = broken.length + mappingFindings.length;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ASIN HEALTH: ${total} issue(s) detected — ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## Weekly ASIN Health Check',
                '',
                '### DEAD ASINs',
                deadLines.length
                  ? ['| ASIN | Product | Status |', '|------|---------|--------|', ...deadLines].join('\n')
                  : 'No dead ASINs found by the existing liveness check.',
                '',
                '## MIS-MAPPED LINKS',
                mappingLines.length
                  ? ['| Page | ASIN | Page Context | Amazon Title | Score | Verdict |', '|------|------|--------------|--------------|-------|---------|', ...mappingLines].join('\n')
                  : 'No mismatched or dead ASIN mappings found by the context-aware check.',
                '',
                '**Action required:** Review every reported dead or mis-mapped link before the next content publish. INCONCLUSIVE results are intentionally excluded and never block the workflow.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['asin-health'],
            });
            console.log(`Opened issue for ${broken.length} dead and ${mappingFindings.length} mis-mapped/dead mapping finding(s).`);
